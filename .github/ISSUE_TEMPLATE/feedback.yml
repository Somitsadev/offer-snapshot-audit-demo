name: Synthetic workflow feedback
description: Tell us about your feed/page mismatch workflow using invented examples only.
title: "[Feedback] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Use invented values such as demo-123 and shop.test. Do not upload files or include live URLs, private data, credentials, account details or customer information.
  - type: textarea
    id: first_hand_problem
    attributes:
      label: Your workflow
      description: What do you do now to check a feed against a product page, and would preparing these files for an offline report be useful?
      placeholder: "Example: I compare the feed price with saved page markup and write down differences."
    validations:
      required: true
  - type: input
    id: time_cost
    attributes:
      label: Approximate time (optional)
      description: About how long does your manual check take?
      placeholder: "Example: 45 minutes"
